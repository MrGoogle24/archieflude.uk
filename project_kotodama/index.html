<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotodama | Japanese Learning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="stats-container">
        <div id="stats">Loading your progress...</div>
        <div class="category-selector">
            <button class="cat-btn active" data-category="all" onclick="setCategory('all')">All</button>
            <button class="cat-btn" data-category="kana" onclick="setCategory('kana')">Kana</button>
            <button class="cat-btn" data-category="vocab" onclick="setCategory('vocab')">Kanji</button>
        </div>
    </div>

    <div class="card-scene">
        <div class="card" id="card" onclick="flipCard()">
            <div class="card-face card-front">
                <div class="label">Question</div>
                <h1 class="char-display" id="question">...</h1>
            </div>
            <div class="card-face card-back">
                <div class="label">Answer</div>
                <h2 class="meaning-display" id="answer">...</h2>
                <video id="card-video" muted playsinline></video>
            </div>
        </div>
    </div>

    <div class="controls" id="controls">
        <button class="btn-wrong" onclick="handleAnswer(false)">❌ Wrong</button>
        <button class="btn-correct" onclick="handleAnswer(true)">✅ Correct</button>
    </div>

    <script src="index.js"></script>
</body>
</html>
